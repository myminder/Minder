<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINDER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MINDER</h1>
    <button class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 11 6 11H0s6-4 6-11"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
    </header>

    <div class="top-action">
      <button id="btnNovoBinder" class="btn-black">+ Novo binder</button>
      </div>

      <div class="binder-area" id="binderArea">
        <div class="binder-card" id="mainBinder">
            <div class="binder"></div>
                <span>New binder <span class="dot"></span></span>
                  </div>
                  </div>

                  <hr>

                  <section class="recentes">
                    <div class="recentes-head"><h2>Recentes</h2><button id="verTudo">Ver Tudo ></button></div>
                      <div class="recentes-grid" id="recentesGrid">
                          <div class="recente-item"></div><div class="recente-item"></div><div class="recente-item"></div><div class="recente-item"></div>
                            </div>
                            </section>

                            <div class="stats">
                              <div><span class="icon">♡</span><b id="numColec">0</b><p>Colecionados</p></div>
                                <div><span class="icon">☆</span><b id="numFav">0</b><p>Favoritos</p></div>
                                  <div><span class="icon">▯</span><b id="numBinders">1</b><p>Binders</p></div>
                                  </div>

                                  <nav class="nav"><button class="active"><span>⌂</span>Home</button></nav>

                                  <!-- MODAL QUE FAZ O BOTÃO FUNCIONAR -->
                                  <div id="modal" class="modal hidden">
                                    <div class="modal-box">
                                        <h3>Novo Binder</h3>
                                            <input id="binderName" placeholder="Nome do binder...">
                                                <div class="modal-actions">
                                                      <button id="cancelar">Cancelar</button>
                                                            <button id="criar" class="btn-black">Criar</button>
                                                                </div>
                                                                  </div>
                                                                  </div>

                                                                  <script src="script.js"></script>
                                                                  </body>
                                                                  </html>
