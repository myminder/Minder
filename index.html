<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="binder-page">
  <div class="bp-top"><button id="voltar">‹ Voltar</button><button id="btnNovaPagina">+ Página</button></div>
    <div class="bp-sub"><span id="paginaInfo"></span><b id="cheiosInfo"></b></div>
      <div class="bp-grid-wrap"><div class="bp-grid" id="bpGrid"></div></div>
        <div class="bp-footer"><button id="ant">Anterior</button><div class="dots" id="dots"></div><button id="prox">Próxima</button></div>
        </div>

        <div id="cardModal" class="card-modal hidden">
          <div class="card-box">
              <div class="sleeve"><img id="cardModalImg"></div>
                  <input id="cardNome" placeholder="Nome do card">
                      <select id="cardTipo"><option>ALBUM</option><option>POB</option><option>LUCKY</option><option>OUTROS</option></select>
                          <button id="salvarCard" class="btn-black">Salvar</button>
                              <button id="fecharCard" class="btn-ghost">Fechar</button>
                                </div>
                                </div>
                                <input id="fileGlobal" type="file" accept="image/*" hidden>
                                <script src="script.js"></script>
                                </body>
                                </html>
