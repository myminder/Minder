<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MINDER - Funcional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{overscroll-behavior:none;overflow:hidden;position:fixed;width:100%;height:100%}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.header{height:56px;display:flex;justify-content:center;align-items:center;position:relative;flex-shrink:0}
.header h1{font-size:26px;font-weight:900;letter-spacing:1px}
.bell{position:absolute;right:16px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.bell:hover{background:#f5f5f5}
.topAction{display:flex;justify-content:flex-end;padding:10px 16px 20px;flex-shrink:0}
.btnNovo{background:#111;color:#fff;border:none;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer}
.btnNovo:active{transform:scale(0.97)}
.binderRow{padding:0 16px;flex-shrink:0;position:relative;display:flex;gap:16px;flex-wrap:wrap}
.binderCard{width:150px;position:relative}
.binder{width:124px;height:172px;background:#CC7A4A;border-radius:4px 12px 12px 4px;position:relative;box-shadow:0 10px 20px rgba(0,0,0,.18);cursor:pointer;transition:.2s}
.binder::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12)}
.clasp{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:42px;height:46px;background:inherit;border-radius:12px 4px 4px 12px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);filter:brightness(1)}
.claspDot{width:24px;height:24px;background:#fff;border-radius:50%}
.binderFooter{display:flex;align-items:center;justify-content:space-between;margin-top:12px;width:124px}
.label{font-size:13px;font-weight:500;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotsBtn{width:28px;height:28px;display:grid;place-items:center;cursor:pointer;border-radius:50%;font-size:18px}
.dotsBtn:hover{background:#f2f2f2}
.menu{position:absolute;left:135px;top:10px;background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:155px;padding:8px;display:none;z-index:50;border:1px solid #f0f0f0}
.menu div{padding:12px 14px;font-size:13px;font-weight:500;cursor:pointer;border-radius:10px}
.menu div:hover{background:#f5f5f5}
.menu .del{color:#ff3b30}
.divider{height:1px;background:#eee;margin:22px 16px;flex-shrink:0}
.recentesHead{display:flex;justify-content:space-between;padding:0 16px 12px}
.recentesHead h2{font-size:20px;font-weight:800}
.recentesHead span{font-size:13px;color:#999;cursor:pointer}
.grid{display:flex;gap:10px;padding:0 16px;overflow-x:auto}
.grid::-webkit-scrollbar{display:none}
.photocard{width:78px;height:112px;border-radius:12px;flex-shrink:0;background:#111;overflow:hidden;cursor:pointer}
.photocard img{width:100%;height:100%;object-fit:cover}
.ico{width:22px;height:22px;stroke:#111;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stats{margin:18px 16px 0;background:#F8F6F7;border-radius:18px;display:flex;padding:18px 0;border:1px solid #F0EAEA;flex-shrink:0}
.stat{flex:1;text-align:center;border-right:1px solid #eee;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat:last-child{border:none}
.stat b{font-size:22px;font-weight:800}
.stat p{font-size:11px;color:#888}
.bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;background:#fff;border-radius:32px;box-shadow:0 12px 32px rgba(0,0,0,.15);display:flex;justify-content:center;padding:12px;border:1px solid #eee;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>MINDER</h1><div class="bell" id="bellBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M15 17h5l-1.5-1.5A6 6 0 0 1 18 12V9a6 6 0 0 0-12 0v3a6 6 0 0 1-.5 2.5L4 17h5"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></div></div>

<div class="topAction"><button class="btnNovo" id="novoBtn">+ Novo binder</button></div>

<div class="binderRow" id="binderRow">
<div class="binderCard">
<div class="binder" style="background:#CC7A4A"><div class="clasp"><div class="claspDot"></div></div></div>
<div class="binderFooter"><div class="label">New binder</div><div class="dotsBtn">⋯</div></div>
<div class="menu">
<div class="edit">Editar capa</div>
<div class="rename">Renomear</div>
<div class="del">Apagar</div>
</div>
</div>
</div>

<div class="divider"></div>
<div style="flex:1;overflow:hidden">
<div class="recentesHead"><h2>Recentes</h2><span id="verTudo">Ver Tudo ›</span></div>
<div class="grid" id="grid">
<div class="photocard"><img src="https://picsum.photos/200/300?random=1"></div>
<div class="photocard"><img src="https://picsum.photos/200/300?random=2"></div>
<div class="photocard"><img src="https://picsum.photos/200/300?random=3"></div>
<div class="photocard"><img src="https://picsum.photos/200/300?random=4"></div>
</div>

<div class="stats">
<div class="stat"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20l-1.4-1.3C5 13.5 2 11 2 8a4 4 0 0 1 7-2.6A4 4 0 0 1 22 8c0 3-3 5.5-8.6 10.7L12 20Z"/></svg><b id="countBinder">1</b><p>Binders</p></div>
<div class="stat"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6H20l-5.1 3.7 1.9 5.7L12 14.3l-4.8 3.7 1.9-5.7L4 8.6h6.1L12 3Z"/></svg><b>0</b><p>Favoritos</p></div>
<div class="stat"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18"/></svg><b>1</b><p>Binders</p>
