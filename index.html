<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:390px;min-height:100vh;position:relative}
.home{padding:16px}
.binder{width:110px;height:145px;background:#2B2B2B;border-radius:8px 12px 12px 8px;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.binder::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:20px;height:30px;background:#3A3A3A;border-radius:6px}
.menu{position:absolute;left:120px;top:70px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:175px;padding:6px;display:none;z-index:10;border:1px solid #eee}
.menu div{padding:11px;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px}
.menu div:hover{background:#f5f5f5}

/* TELA DE EDITAR */
.edit{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;max-width:390px;left:50%;transform:translateX(-50%)}
.top{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #eee;font-size:12px}
.mid{display:flex;flex-direction:column;align-items:center;padding:12px 0}
.txt{font-family:Impact;font-size:17px;text-align:center;line-height:1.1}
.binder2{width:125px;height:165px;background:#C9A78A;border-radius:3px 10px 10px 3px;position:relative;margin-top:10px;box-shadow:0 6px 16px rgba(0,0,0,.12);overflow:hidden}
.bottom{margin-top:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 20px rgba(0,0,0,.08);padding:10px}
.label{font-family:Impact;font-size:11px;text-align:center;margin:6px 0}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:4px;cursor:pointer}
.wheel{width:80px;height:80px;border-radius:50%;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);margin:10px auto;position:relative}
.wheel::after{content:'';position:absolute;inset:15px;background:#fff;border-radius:50%}
</style>
</head>
<body>
<div class="app">
<!-- 1. TELA NORMAL (seu print) -->
<div class="home">
<h1 style="font-size:16px;text-align:center">MINDER</h1>
<div style="position:relative;margin-top:20px">
<div class="binder" id="b1" onclick="document.getElementById('menu').style.display='block'"></div>
<div style="margin-top:8px;font-weight:600;font-size:13px">New binder ⋮</div>
<div class="menu" id="menu">
<div onclick="abrirEditor()">📝 Editar capa</div>
<div>✏️ Renomear</div>
<div>🗑️ Apagar</div>
</div>
</div>
</div>

<!-- 2. TELA DE EDITAR (seu video) -->
<div class="edit" id="edit">
<div class="top"><span onclick="fecharEditor()">← voltar</span><b>New Diary ✎</b><span style="font-size:10px">Doyol</span></div>
<div class="mid">
<div class="txt">YOU CAN COSTUMISE<br>YOUR NOTEBOOK COVER</div>
<div class="binder2" id="b2"></div>
<div style="font-size:9px;color:#aaa;margin-top:6px">You can zoom in/out with two fingers!</div>
</div>
<div class="bottom">
<div class="label">CHOOSE YOUR FAV COLOURS</div>
<div class="dots" id="dots"></div>
<div class="wheel" id="wheel"></div>
<div class="label">YOU CAN ADD STICKERS</div>
<div style="display:flex;gap:6px;justify-content:center">
<span onclick="add('H')" style="background:#f3f3f3;padding:6px;border-radius:6px">H</span>
<span onclick="add('♡')" style="background:#f3f3f3;padding:6px;border-radius:6px">♡</span>
<span onclick="add('★')" style="background:#f3f3f3;padding:6px;border-radius:6px">★</span>
<label style="background:#111;color:#fff;padding:6px;border-radius:6px">📷<input type="file" hidden accept="image/*" onchange="addFoto(event)"></label>
</div>
</div>
</div>
</div>

<script>
const b1=document.getElementById('b1'), b2=document.getElementById('b2'), dots=document.getElementById('dots');
['#E7D7F2','#FFD6E0','#FF8A8A','#FFC16A','#FFE27A','#8AD88A','#8AB4FF','#C9A78A'].forEach(c=>{
 let d=document.createElement('div');d.className='dot';d.style.background=c;
  d.onclick=()=>{b1.style.background=c;b2.style.background=c};dots.appendChild(d)
  });
  function abrirEditor(){document.getElementById('menu').style.display='none';document.getElementById('edit').style.display='flex';b2.style.background=b1.style.background||'#C9A78A'}
  function fecharEditor(){document.getElementById('edit').style.display='none'}
  document.getElementById('wheel').onclick=(e)=>{
   const r=e.currentTarget.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
    const h=(Math.atan2(y,x)*180/Math.PI+360)%360; const c=`hsl(${h},70%,65%)`; b1.style.background=c; b2.style.background=c;
    }
    function add(t){let s=document.createElement('div');s.textContent=t;s.style.position='absolute';s.style.left='40%';s.style.top='40%';b2.appendChild(s)}
    function addFoto(ev){let f=ev.target.files[0];if(!f)return;let u=URL.createObjectURL(f);let i=document.createElement('img');i.src=u;i.style.position='absolute';i.style.left='30%';i.style.top='30%';i.style.width='30px';i.style.height='30px';b2.appendChild(i)}
    </script>
    </body>
    </html>
