<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MINDER</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>MINDER</h1><button class="bell" type="button"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3.2l-1.2 2H19l-1.2-2V7a5 5 0 0 0-5-5z"/><circle cx="12" cy="18.5" r="1.8"/></svg></button></header>
<div class="top-action"><button id="btnNovo" class="btn-black" type="button">+ Novo binder</button></div>
<div class="binder-area" id="binderArea">
  <div class="binder-card" data-name="New binder">
      <div class="binder" style="--cor:#C69A6B"><div class="lacre"><span></span></div></div>
          <div class="binder-info"><span class="label">New binder</span><button class="dots-btn" type="button">...</button><div class="menu hidden"><button type="button" data-a="capa">Editar capa</button><button type="button" data-a="renomear">Renomear</button><button type="button" data-a="apagar" class="danger">Apagar</button></div></div>
            </div>
            </div>
            <section class="recentes"><div class="recentes-head"><h2>Recentes</h2><button id="verTudo" type="button">Ver Tudo ></button></div><div class="recentes-grid" id="recentesGrid"></div><p class="empty-text" id="emptyText">Nenhum photocard ainda</p></section>
            <div class="stats"><div><svg viewBox="0 0 24 24" class="ico"><path d="M12 19s-6-4.2-6-8.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 6 3.5C18 14.8 12 19 12 19z"/></svg><b id="c1">0</b><p>Colecionados</p></div><div><svg viewBox="0 0 24 24" class="ico"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8l-4.8 2.1.9-5.4L4.2 7.7l5.4-.8z"/></svg><b>0</b><p>Favoritos</p></div><div><svg viewBox="0 0 24 24" class="ico"><rect x="6" y="3" width="12" height="16" rx="2"/></svg><b id="cBinders">1</b><p>Binders</p></div></div>
            <nav class="nav"><button class="home-active" type="button">⌂<br>Home</button></nav>
            <div id="binderPage" class="binder-page hidden">
              <div class="bp-top"><button id="voltar" type="button">‹ Voltar</button></div>
                <div class="bp-sub"><span id="paginaInfo">Página 1 de 2</span><b id="cheiosInfo">0/4 cheios</b></div>
                  <div class="bp-grid-wrap"><div class="bp-grid">
                      <div class="slot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.2"/><path d="M21 14l-4-4-4 4"/></svg><p>toque para colocar<br>um photocard</p><input type="file" accept="image/*" hidden></div>
                          <div class="slot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.2"/><path d="M21 14l-4-4-4 4"/></svg><p>toque para colocar<br>um photocard</p><input type="file" accept="image/*" hidden></div>
                              <div class="slot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.2"/><path d="M21 14l-4-4-4 4"/></svg><p>toque para colocar<br>um photocard</p><input type="file" accept="image/*" hidden></div>
                                  <div class="slot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.2"/><path d="M21 14l-4-4-4 4"/></svg><p>toque para colocar<br>um photocard</p><input type="file" accept="image/*" hidden></div>
                                    </div></div>
                                      <div class="bp-footer"><button id="ant" type="button">Anterior</button><div class="dots"><span class="dot active"></span><span class="dot"></span></div><button id="prox" type="button">Próxima</button></div>
                                      </div>
                                      <div id="modalNovo" class="modal hidden"><div class="box"><h3>Novo Binder</h3><input id="inputNome" placeholder="Nome do binder"><div class="actions"><button id="cancelar" type="button">Cancelar</button><button id="criar" class="btn-black" type="button">Criar</button></div></div></div>
                                      <input id="colorPicker" type="color" hidden>
                                      <script src="script.js"></script>
                                      </body></html>
