<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#F5F5F3;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:#F7F7F8;min-height:100vh;position:relative;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 20px;background:white;border-bottom:2.5px solid #111}
.top h1{font-size:32px;font-weight:900;letter-spacing:-1.5px}
.cam{width:42px;height:42px;border-radius:50%;border:2.5px solid #111;background:white;display:grid;place-items:center;font-size:18px;cursor:pointer}
.newbar{display:flex;justify-content:flex-end;padding:14px 20px;background:#F0EFF4}
.btn-new{background:#111;color:white;border:none;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13px}
.shelfWrap{background:#F0EFF4;display:flex;flex-direction:column;align-items:center;padding:10px 0 20px}
.binder{width:140px;height:188px;background:#2A2A2A;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;color:white}
.dots{position:absolute;top:6px;right:8px;color:white;font-size:18px;cursor:pointer}
.menu{position:absolute;top:30px;right:0;background:white;color:#111;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:160px;display:none;z-index:10}
.menu div{padding:12px 14px;font-size:13px}
.sec{padding:18px 20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{aspect-ratio:3/4.2;background:#EDEAE3;border-radius:12px;position:relative;overflow:hidden}
.pc img{width:100%;height:100%;object-fit:cover}
.wm{position:absolute;bottom:6px;right:6px;font-size:10px;color:white;background:rgba(0,0,0,.3);padding:3px 7px;border-radius:999px;font-style:italic}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:2.5px solid #111;display:flex;justify-content:space-around;padding:12px 0}
.tab{font-size:12px;font-weight:800;opacity:.35;cursor:pointer}.tab.active{opacity:1}
.view{display:none;flex-direction:column}.view.on{display:flex}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>MINDER</h1><button class="cam" onclick="document.getElementById('file').click()">📷</button></div>
<div id="v-binders" class="view on">
<div class="newbar"><button class="btn-new" onclick="newBinder()">+ Novo binder</button></div>
<div class="shelfWrap"><div class="binder">I LOVE DREAM<span class="dots" onclick="toggleMenu(event)">⋮</span><div class="menu" id="binderMenu"><div>Renomear</div><div>Editar capa</div><div style="color:red">Apagar</div></div></div><span style="font-size:12px;margin-top:8px;opacity:.6">New • 0 page</span></div>
<div class="sec"><h2>Recentes</h2><div class="cards" id="recentGrid"></div></div>
</div>
<div class="bottom"><div class="tab active">Binders</div><div class="tab">Biblioteca</div><div class="tab">Chat</div></div>
<input type="file" id="file" hidden accept="image/*" onchange="addPhoto(event)">
</div>
<script>
let photos=[];
function toggleMenu(e){e.stopPropagation();const m=document.getElementById('binderMenu');m.style.display=m.style.display==='block'?'none':'block'}
function addPhoto(e){const url=URL.createObjectURL(e.target.files[0]);photos.unshift(url);render()}
function render(){const g=document.getElementById('recentGrid');g.innerHTML='';if(photos.length==0){for(let i=0;i<4;i++)g.innerHTML+=`<div class="pc" style="display:grid;place-items:center;opacity:.5">Photocard</div>`;return}photos.slice(0,4).forEach(u=>g.innerHTML+=`<div class="pc"><img src="${u}"><span class="wm">@myminder</span></div>`)}render();
</script>
</body>
</html>
