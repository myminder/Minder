<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MINDER</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>MINDER</h1><button class="bell"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v3.5l-1.5 2.5h15L18 11.5V8a6 6 0 0 0-6-6z"/><circle cx="12" cy="19" r="2"/></svg></button></header>

<div class="top-action"><button id="btnNovo" class="btn-black">+ Novo binder</button></div>

<div class="binder-area" id="binderArea">
  <!-- COMEÇA COM 1 SÓ -->
    <div class="binder-card" data-name="New binder">
        <div class="binder" style="--cor:#C69A6B">
              <div class="lacre"><span></span></div>
                  </div>
                      <div class="binder-info">
                            <span class="label">New binder</span>
                                  <button class="dots-btn">⋮</button>
                                      </div>
                                        </div>
                                        </div>

                                        <section class="recentes">
                                          <div class="recentes-head"><h2>Recentes</h2><button id="verTudo">Ver Tudo ></button></div>
                                            <div class="recentes-grid" id="recentesGrid"></div>
                                              <p class="empty-text" id="emptyText">Nenhum photocard ainda</p>
                                              </section>

                                              <div class="stats">
                                                <div><svg viewBox="0 0 24 24" class="ico"><path d="M12 19s-6-4.2-6-8.5A3.5 3.5 0 0 1 12 7a3.5 3.5 0 0 1 6 3.5C18 14.8 12 19 12 19z"/></svg><b id="c1">0</b><p>Colecionados</p></div>
                                                  <div><svg viewBox="0 0 24 24" class="ico"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8l-4.8 2.1.9-5.4L4.2 7.7l5.4-.8z"/></svg><b>0</b><p>Favoritos</p></div>
                                                    <div><svg viewBox="0 0 24 24" class="ico"><rect x="6" y="3" width="12" height="16" rx="2"/></svg><b id="cBinders">1</b><p>Binders</p></div>
                                                    </div>

                                                    <nav class="nav"><button class="home-active"><span class="home-icon">⌂</span>Home</button></nav>

                                                    <!-- PÁGINA INTERNA -->
                                                    <div id="binderPage" class="binder-page hidden">
                                                      <div class="bp-header">
                                                          <button id="voltar">‹ Voltar</button>
                                                              <div><span id="paginaInfo">Página 1 de 2</span> <b id="cheiosInfo">0/4 cheios</b></div>
                                                                </div>
                                                                  <div class="bp-grid">
                                                                      <div class="slot"><div class="slot-inner"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5-5 5"/></svg><p>toque para colocar<br>um photocard</p></div><input type="file" accept="image/*" hidden></div>
                                                                          <div class="slot"><div class="slot-inner"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5-5 5"/></svg><p>toque para colocar<br>um photocard</p></div><input type="file" accept="image/*" hidden></div>
                                                                              <div class="slot"><div class="slot-inner"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5-5 5"/></svg><p>toque para colocar<br>um photocard</p></div><input type="file" accept="image/*" hidden></div>
                                                                                  <div class="slot"><div class="slot-inner"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5-5 5"/></svg><p>toque para colocar<br>um photocard</p></div><input type="file" accept="image/*" hidden></div>
                                                                                    </div>
                                                                                      <div class="bp-footer"><button id="ant">Anterior</button><div class="dots"><span class="dot active"></span><span class="dot"></span></div><button id="prox">Próxima</button></div>
                                                                                      </div>

                                                                                      <div id="modalNovo" class="modal hidden"><div class="box"><h3>Novo Binder</h3><input id="inputNome" placeholder="Nome do binder"><input id="inputCor" type="color" value="#C69A6B"><div class="actions"><button id="cancelar">Cancelar</button><button id="criar" class="btn-black">Criar</button></div></div></div>

                                                                                      <script src="script.js"></script>
                                                                                      </body>
                                                                                      </html>
