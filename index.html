<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINDER</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Sniglet&display=swap" rel="stylesheet">
<style>
:root{--bg:#D6E6F0;--green:#1E3A2B;--paper:#FFF9B1;--mint:#A8C5B5;--pink:#F8C2D1}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Baloo 2',sans-serif;color:var(--green)}
header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2.5px solid var(--green)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{background:var(--paper);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.wrap{min-height:80vh;display:grid;place-items:center;padding:22px}
.binder{background:var(--paper);width:100%;max-width:390px;aspect-ratio:3/4.3;border-radius:28px;position:relative;box-shadow:0 12px 0 #E8E2A0,0 20px 40px rgba(0,0,0,.15);padding:20px;cursor:pointer}
.binder::before{content:'';position:absolute;left:0;top:0;bottom:0;width:44px;background:#FFF5A5;border-radius:28px 0 0 28px;border-right:2px solid #E8E2A0}
.label{background:#fff;border:3.5px solid #E9E9E9;border-radius:18px;padding:28px 18px;text-align:center;margin-top:135px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.label small{letter-spacing:4px;font-weight:800;font-size:13px}
.label h1{font-family:'Sniglet',cursive;font-size:36px;font-weight:400;margin:10px 0;transform:rotate(-2deg)}
.label p{color:#8BA08B;font-size:15px}
.star{position:absolute;left:20px;bottom:90px;font-size:42px;opacity:.9}
.sparkle{position:absolute;right:36px;top:90px;font-size:28px;opacity:.7}
.page{display:none;background:#fff;width:100%;max-width:410px;border-radius:26px;padding:16px 16px 22px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.page.show{display:block}
.top{display:flex;justify-content:space-between;padding:8px 4px 12px;font-weight:700}
.grid{background:var(--grid,#F8C2D1);border-radius:22px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;transition:.3s}
.slot{background:#DDEBE1;border:3px solid #fff;border-radius:18px;aspect-ratio:3/4.2;display:grid;place-items:center;text-align:center;color:#6B8A7A;font-size:14px;line-height:1.2;cursor:pointer;overflow:hidden;position:relative}
.slot svg{width:44px;height:44px;margin-bottom:8px;opacity:.8}
.slot img{width:100%;height:100%;object-fit:cover}
.btn{border:2px solid var(--green);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;margin:14px auto 0;display:block}
.colors{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.colors button{width:44px;height:44px;border-radius:50%;border:3.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12);cursor:pointer}
</style>
</head>
<body>
<header><div class="logo"><i>★</i> MINDER</div><div>Meus Binders ▼ ⚙️</div></header>
<div class="wrap">
<div class="binder" id="cover" onclick="openBinder()"><div class="sparkle">✨</div><div class="label"><small>MINDER</small><h1>my first binder</h1><p>photocard archive</p></div><div class="star">⭐</div></div>

<div class="page" id="page">
<div class="top"><span>Página 1 de 8</span><span id="count">0/4 cheios</span></div>
<div class="grid" id="grid">
<div class="slot" onclick="pick(this)"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16a3 3 0 100-6 3 3 0 000 6z"/><path d="M3 9l2-2h3l2-2h4l2 2h3l2 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M19 5v4M21 7h-4"/></svg><br>toque para colocar<br>um photocard</div></div>
<div class="slot" onclick="pick(this)"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16a3 3 0 100-6 3 3 0 000 6z"/><path d="M3 9l2-2h3l2-2h4l2 2h3l2 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M19 5v4M21 7h-4"/></svg><br>toque para colocar<br>um photocard</div></div>
<div class="slot" onclick="pick(this)"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16a3 3 0 100-6 3 3 0 000 6z"/><path d="M3 9l2-2h3l2-2h4l2 2h3l2 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M19 5v4M21 7h-4"/></svg><br>toque para colocar<br>um photocard</div></div>
<div class="slot" onclick="pick(this)"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16a3 3 0 100-6 3 3 0 000 6z"/><path d="M3 9l2-2h3l2-2h4l2 2h3l2 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M19 5v4M21 7h-4"/></svg><br>toque para colocar<br>um photocard</div></div>
</div>
<button class="btn" onclick="closeBinder()">← Voltar pra capa</button>
<div class="colors">
<button style="background:#A8C5B5" onclick="setGrid('#A8C5B5')"></button>
<button style="background:#F8C2D1" onclick="setGrid('#F8C2D1')"></button>
<button style="background:#FFF9B1" onclick="setGrid('#FFF9B1')"></button>
<button style="background:#C5B3FF" onclick="setGrid('#C5B3FF')"></button>
<button style="background:#FFD8A8" onclick="setGrid('#FFD8A8')"></button>
<button style="background:#B3D9FF" onclick="setGrid('#B3D9FF')"></button>
</div>
</div>
</div>
<input type="file" id="file" hidden accept="image/*">
<script>
let cur=null;
function openBinder(){cover.style.display='none';page.classList.add('show')}
function closeBinder(){cover.style.display='block';page.classList.remove('show')}
function pick(el){cur=el;file.click()}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);cur.innerHTML=`<img src="${u}">`;upd()}
function upd(){count.textContent=document.querySelectorAll('.slot img').length+'/4 cheios'}
function setGrid(c){grid.style.setProperty('--grid',c);grid.style.background=c}
</script>
</body>
</html>
