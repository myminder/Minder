<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#F5F5F3;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:#fff;min-height:100vh;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1.5px solid #111}
.top h1{font-size:28px;font-weight:900;letter-spacing:-1px}
.cam{width:38px;height:38px;border-radius:50%;border:1.5px solid #111;background:#fff;display:grid;place-items:center}
.newbar{display:flex;justify-content:flex-end;padding:12px 20px;background:#F3F1F8}
.btn-new{background:#111;color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:700}
.shelfWrap{background:#F3F1F8;display:flex;flex-direction:column;align-items:center;padding:14px 0 26px}

/* BINDER LISO - OPÇÃO C */
.binder{width:160px;height:212px;border-radius:4px 14px 14px 4px;position:relative;box-shadow:0 10px 22px rgba(0,0,0,.15);transition:.25s}
.binder::before{content:'';position:absolute;left:0;top:0;bottom:0;width:15px;background:rgba(0,0,0,.08);border-radius:4px 0 0 4px}
.dots{position:absolute;top:8px;right:10px;cursor:pointer;font-size:18px;color:rgba(0,0,0,.45);z-index:5;background:rgba(255,255,255,.6);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}

.menu{position:absolute;top:34px;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:190px;display:none;z-index:20;overflow:hidden;border:1px solid #eee}
.menu b{display:block;padding:12px 14px 6px;font-size:11px;opacity:.5;letter-spacing:.5px}
.menu div{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu div:hover{background:#F5F3FF}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1.2px solid #111;display:flex;justify-content:space-around;padding:10px 0}
.tab{font-size:10px;font-weight:700;opacity:.35;text-align:center}.tab.active{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>MINDER</h1><div class="cam">📷</div></div>
<div class="newbar"><button class="btn-new">+ Novo binder</button></div>
<div class="shelfWrap">
<div class="binder" id="binder" style="background:#FFC5DB">
<span class="dots" onclick="toggleMenu(event)">⋮</span>
<div class="menu" id="menu">
<b>COR DA CAPA</b>
<div onclick="setColor('#FFC5DB')"><span class="color-dot" style="background:#FFC5DB"></span>Rosa - NewJeans</div>
<div onclick="setColor('#2A2A2A')"><span class="color-dot" style="background:#2A2A2A"></span>Preto - I LOVE DREAM</div>
<div onclick="setColor('#FFE6A5')"><span class="color-dot" style="background:#FFE6A5"></span>Amarelo</div>
<div onclick="setColor('#A5D6FF')"><span class="color-dot" style="background:#A5D6FF"></span>Azul</div>
<div onclick="setColor('#C5FFC5')"><span class="color-dot" style="background:#C5FFC5"></span>Verde</div>
<div onclick="setColor('#E9D5FF')"><span class="color-dot" style="background:#E9D5FF"></span>Lilás</div>
<b style="margin-top:6px;border-top:1px solid #eee;padding-top:10px">AÇÕES</b>
<div onclick="editName()">✏️ Renomear</div>
<div onclick="clearAll()" style="color:#E53E3E">🗑️ Apagar</div>
</div>
</div>
<div style="margin-top:12px;font-size:11px;color:#777" id="label">New • liso</div>
</div>
</div>
<div class="bottom"><div class="tab active">Binders</div><div class="tab">Biblioteca</div><div class="tab">Chat</div></div>
</div>
<script>
function toggleMenu(e){e.stopPropagation();const m=document.getElementById('menu');m.style.display=m.style.display==='block'?'none':'block'}
function setColor(c){document.getElementById('binder').style.background=c;document.getElementById('menu').style.display='none';document.getElementById('label').textContent='New • '+c}
function editName(){let n=prompt('Nome:','Meu binder');if(n) document.getElementById('label').textContent=n}
function clearAll(){if(confirm('Apagar?')) setColor('#FFC5DB')}
document.addEventListener('click',()=>{document.getElementById('menu').style.display='none'})
</script>
</body>
</html>
