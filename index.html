<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#EAEAEA;display:flex;justify-content:center}
.app{width:100%;max-width:400px;min-height:100vh;background:#fff;position:relative;padding-bottom:100px}

.header{height:52px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.header h1{font-size:24px;font-weight:900;letter-spacing:1.5px}
.bell{position:absolute;right:14px;top:12px;width:28px;height:28px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:18px}

.topAction{display:flex;justify-content:flex-end;padding:8px 14px;background:#fff}
.btnNovo{background:#111;color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.2px}

.binderArea{padding:0 16px;background:#fff}
.binderWrap{width:118px}
.binder{width:118px;height:155px;background:#fff;border-radius:10px 14px 14px 10px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.18);overflow:hidden;border:1px solid #eee}
.binder img{width:100%;height:100%;object-fit:cover}
.clasp{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:22px;height:30px;background:#111;border-radius:6px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.clasp::after{content:'';width:10px;height:10px;background:#fff;border-radius:50%}
.binderLabel{margin-top:8px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.binderLabel::after{content:'';width:14px;height:14px;background:#111;border-radius:50%;display:inline-block}

.divider{height:1px;background:#EDEDED;margin:22px 16px}

.recentesHead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-bottom:12px}
.recentesHead h2{font-size:20px;font-weight:800}
.recentesHead span{font-size:13px;color:#999;font-weight:500}

.recentesGrid{display:flex;gap:10px;padding:0 16px;overflow-x:auto}
.recentesGrid::-webkit-scrollbar{display:none}
.rec{width:78px;height:112px;background:#111;border-radius:10px;flex-shrink:0}

.statsBox{margin:22px 16px;background:#F7F5F6;border-radius:14px;display:flex;padding:14px 0;border:1px solid #F0EDEF}
.stat{flex:1;text-align:center;border-right:1px solid #EAEAEA}
.stat:last-child{border:none}
.stat .icon{font-size:20px}
.stat b{font-size:22px;font-weight:800;display:block;margin-top:2px}
.stat p{font-size:11px;color:#666;margin-top:2px;font-weight:500}

.bottomNav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#fff;border-radius:34px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;align-items:center;padding:8px 18px;border:1px solid #eee;z-index:10}
.navItem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;opacity:.3}
.navItem.active{opacity:1}
.navItem .ico{font-size:20px}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>MINDER</h1><div class="bell">🔔</div></div>

<div class="topAction"><button class="btnNovo">+ Novo binder</button></div>

<div class="binderArea">
<div class="binderWrap">
<div class="binder"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" style="filter: contrast(1.2) saturate(1.5);"><div class="clasp"></div></div>
<div class="binderLabel">New binder</div>
</div>
</div>

<div class="divider"></div>

<div class="recentesHead"><h2>Recentes</h2><span>Ver Tudo ›</span></div>
<div class="recentesGrid">
<div class="rec"></div><div class="rec"></div><div class="rec"></div><div class="rec"></div>
</div>

<div class="statsBox">
<div class="stat"><div class="icon">🩷</div><b>0</b><p>Colecionados</p></div>
<div class="stat"><div class="icon">⭐</div><b>0</b><p>Favoritos</p></div>
<div class="stat"><div class="icon">📒</div><b>1</b><p>Binders</p></div>
</div>

<div class="bottomNav">
<div class="navItem active"><div class="ico">⌂</div><span>Home</span></div>
</div>
</div>
</body>
</html>
