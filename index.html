<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDER - Binder Corrigido</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;background:#fff;position:relative;padding-bottom:100px}

/* HEADER minimalista */
.header{height:56px;display:flex;justify-content:center;align-items:center;position:relative}
.header h1{font-size:26px;font-weight:900;letter-spacing:1px}
.bell{position:absolute;right:16px}
.icon{stroke:#111;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* BOTÃO */
.topAction{display:flex;justify-content:flex-end;padding:10px 16px 24px}
.btnNovo{background:#111;color:#fff;border:none;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}

/* BINDER EXATO DA SUA FOTO */
.binderRow{padding:0 16px}
.binderCard{width:140px}
.binder{
width:124px;height:172px;
background:#CC7A4A;
border-radius:4px 12px 12px 4px;
position:relative;
box-shadow:0 10px 20px rgba(0,0,0,.18);
}
/* linha da lombada */
.binder::before{
content:'';
position:absolute;
left:16px;top:0;bottom:0;
width:2px;
background:rgba(0,0,0,.12);
}
/* fecho mesma cor do binder */
.clasp{
position:absolute;
right:-16px;
top:50%;
transform:translateY(-50%);
width:42px;height:46px;
background:#CC7A4A;
border-radius:12px 4px 4px 12px;
display:grid;
place-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.claspDot{
width:24px;height:24px;
background:#fff;
border-radius:50%;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.label{margin-top:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.labelDot{width:14px;height:14px;background:#111;border-radius:50%}

.divider{height:1px;background:#eee;margin:28px 16px 22px}
.recentesHead{display:flex;justify-content:space-between;padding:0 16px 14px}
.recentesHead h2{font-size:20px;font-weight:800}
.recentesHead span{font-size:13px;color:#999;display:flex;align-items:center;gap:4px}
.grid{display:flex;gap:10px;padding:0 16px}
.rec{width:78px;height:112px;background:#111;border-radius:12px}

.stats{margin:24px 16px;background:#F8F6F7;border-radius:18px;display:flex;padding:16px 0;border:1px solid #F0EAEA}
.stat{flex:1;text-align:center;border-right:1px solid #eee;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat:last-child{border:none}
.stat b{font-size:22px;font-weight:800}
.stat p{font-size:11px;color:#888}
.bottom{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;background:#fff;border-radius:32px;box-shadow:0 12px 32px rgba(0,0,0,.15);display:flex;justify-content:center;padding:12px;border:1px solid #eee}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>MINDER</h1>
<div class="bell">
<svg class="icon" width="22" height="22" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 10H0c0-5 6-3 6-10Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
</div>
</div>

<div class="topAction">
<button class="btnNovo">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
Novo binder
</button>
</div>

<div class="binderRow">
<div class="binderCard">
<div class="binder">
<div class="clasp"><div class="claspDot"></div></div>
</div>
<div class="label">New binder <div class="labelDot"></div></div>
</div>
</div>

<div class="divider"></div>

<div class="recentesHead"><h2>Recentes</h2><span>Ver Tudo <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="grid"><div class="rec"></div><div class="rec"></div><div class="rec"></div><div class="rec"></div></div>

<div class="stats">
<div class="stat"><svg class="icon" width="22" height="22" viewBox="0 0 24 24"><path d="M12 20l-1.5-1.4C5 13.5 2 11 2 8a4 4 0 0 1 7-2.7A4 4 0 0 1 22 8c0 3-3 5.5-8.5 10.6L12 20Z"/></svg><b>0</b><p>Colecionados</p></div>
<div class="stat"><svg class="icon" width="22" height="22" viewBox="0 0 24 24"><path d="M12 3l1.8 5.5H19l-4.4 3.2 1.7 5.3L12 14.8 7.7 17l1.7-5.3L5 8.5h5.2L12 3Z"/></svg><b>0</b><p>Favoritos</p></div>
<div class="stat"><svg class="icon" width="22" height="22" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5Z"/><path d="M8 3v18"/></svg><b>1</b><p>Binders</p></div>
</div>

<div class="bottom"><div style="display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;gap:2px"><svg class="icon" width="22" height="22" viewBox="0 0 24 24"><path d="M3 10L12 3l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg>Home</div></div>
</div>
</body>
</html>
